# A ogni PR unita (push su main) rifà le app per Android e per Windows con le novità e le ripubblica nelle Releases:
#   - la demo con i dati di esempio, i 3 piani e le 5 entrate (proprietario, cliente, trainer, nuovo cliente, nuovo centro):
#     Releases → "Demo per Android" (K9Manager-Demo.apk) e "Demo per Windows" (K9Manager-Windows-Demo.exe);
#   - l'app collegata al database della prova: prima aggiunge al database le migrazioni nuove (i dati restano),
#     poi costruisce APK e programma per Windows: Releases → "Prova di K9 Manager – <progetto>" (K9Manager-Prova.apk e
#     K9Manager-Prova-Windows.exe).
# Se la prova vecchia è in pausa (la mette in pausa "Prova generale") la salta. Se la prova generale è accesa,
# aggiorna anche quella: le funzioni del gestore, l'APK, il programma per Windows e il pannello K9 Gestore.
# Si lancia anche dal pannello K9 Gestore (App e versioni).
# Il progetto della prova è PROVA_PROGETTO qui sotto (il codice in xxxx.supabase.co): per collegare un'altra prova
# cambialo qui. Usa il secret SUPABASE_ACCESS_TOKEN, lo stesso di "Prova con database".
# Si può lanciare anche a mano: Actions → Aggiorna le app → Run workflow.
name: Aggiorna le app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Due PR unite di seguito: vale l'ultima, quella in corso si ferma.
concurrency:
  group: aggiorna-app
  cancel-in-progress: true

env:
  PROVA_PROGETTO: jnysclqgutqetrxitlez

jobs:
  demo:
    uses: ./.github/workflows/android-demo.yml
    # La chiave di caricamento di Google Play, per l'AAB.
    secrets: inherit

  database:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.prova.outputs.url }}
      chiave: ${{ steps.prova.outputs.chiave }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: prova
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node tools/nuova-prova.mjs --ref "$PROVA_PROGETTO" --se-attivo si

  app:
    needs: database
    if: ${{ needs.database.outputs.url != '' }}
    uses: ./.github/workflows/android.yml
    secrets: inherit
    with:
      supabase_url: ${{ needs.database.outputs.url }}
      supabase_key: ${{ needs.database.outputs.chiave }}
      # Ogni aggiornamento sposta la fine della prova a 30 giorni da oggi.
      giorni: '30'

  demo-windows:
    uses: ./.github/workflows/windows.yml
    with:
      demo: true

  app-windows:
    needs: database
    if: ${{ needs.database.outputs.url != '' }}
    uses: ./.github/workflows/windows.yml
    with:
      supabase_url: ${{ needs.database.outputs.url }}
      supabase_key: ${{ needs.database.outputs.chiave }}
      giorni: '30'

  generale:
    uses: ./.github/workflows/prova-generale.yml
    secrets: inherit
