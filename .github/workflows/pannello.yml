# Costruisce "Club Gestore", il tuo pannello per tutti i centri registrati dall'app: centri, addebiti,
# licenze, statistiche. Esce per Windows, Mac e Android in GitHub → Releases → "Club Gestore" (ClubGestore-Windows.exe,
# ClubGestore-Mac.dmg e ClubGestore-Android.apk, da installare sul telefono). Si installa accanto a Club Manager, senza toccarlo.
#
# Demo con centri e addebiti finti, senza server: Run workflow con "demo" spuntato. Esce in Releases →
# "Demo di Club Gestore" (ClubGestore-Demo-Windows.exe e ClubGestore-Demo-Mac.dmg).
#
# Partenza: a mano (Run workflow), con l'indirizzo delle funzioni del gestore e la sua publishable key
# (vedi gestore/README.md). Al posto degli input puoi mettere le variabili GESTORE_URL e GESTORE_KEY in
# Settings → Secrets and variables → Actions → Variables. Mai la secret key: il pannello entra con il tuo utente.
name: Pannello del gestore

on:
  workflow_dispatch:
    inputs:
      demo:
        description: Demo con dati finti, senza server
        type: boolean
        default: false
      gestore_url:
        description: Indirizzo delle funzioni del gestore (https://xxxx.supabase.co/functions/v1)
        required: false
      gestore_key:
        description: Publishable key del progetto gestore (sb_publishable_...)
        required: false
  # La usa "Prova generale", dopo aver acceso il gestore.
  workflow_call:
    inputs:
      demo:
        type: boolean
        default: false
      gestore_url:
        type: string
        default: ''
      gestore_key:
        type: string
        default: ''

permissions:
  contents: write

# Club Gestore ha l'icona di Club Manager con lo sfondo blu (assets/images/icon-gestore.png).
env:
  EXPO_PUBLIC_PANNELLO: '1'
  EXPO_PUBLIC_PANNELLO_DEMO: ${{ inputs.demo && '1' || '' }}
  NOME: ${{ inputs.demo && 'ClubGestore-Demo' || 'ClubGestore' }}
  # La demo si installa accanto al pannello vero, senza sostituirlo.
  APP_ID: ${{ inputs.demo && 'it.campocani.gestoredemo' || 'it.campocani.gestore' }}
  EXPO_PUBLIC_GESTORE_URL: ${{ inputs.gestore_url || vars.GESTORE_URL }}
  EXPO_PUBLIC_GESTORE_KEY: ${{ inputs.gestore_key || vars.GESTORE_KEY }}
  # Accesso con Google al pannello (vedi gestore/README.md): vuote = solo email e password.
  EXPO_PUBLIC_GOOGLE_DESKTOP_CLIENT_ID: ${{ !inputs.demo && vars.GOOGLE_DESKTOP_CLIENT_ID || '' }}
  EXPO_PUBLIC_GOOGLE_DESKTOP_SECRET: ${{ !inputs.demo && vars.GOOGLE_DESKTOP_SECRET || '' }}

jobs:
  # Prima la release, poi ogni sistema ci carica il suo file: niente artifact da passare fra un job e l'altro
  # (lo spazio per gli artifact di GitHub ha un limite, le Releases no).
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
    steps:
      - name: Controlla gli input
        if: ${{ !inputs.demo }}
        shell: bash
        run: |
          case "$EXPO_PUBLIC_GESTORE_URL" in https://*.supabase.co/functions/v1) ;; *) echo "::error::gestore_url deve essere https://xxxx.supabase.co/functions/v1"; exit 1;; esac
          case "$EXPO_PUBLIC_GESTORE_KEY" in sb_publishable_*) ;; *) echo "::error::gestore_key deve essere la publishable key (sb_publishable_...), mai la secret key"; exit 1;; esac
      - id: r
        name: Prepara la release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -n "$EXPO_PUBLIC_PANNELLO_DEMO" ]; then
            TAG=pannello-demo; TITLE="Demo di Club Gestore"
            NOTES="Demo del pannello Club Gestore con centri e addebiti finti, senza server: entri con una email e una password qualsiasi. Le modifiche restano finché il programma è aperto."
          else
            TAG=pannello-gestore; TITLE="Club Gestore"
            NOTES="Il tuo pannello per tutti i centri registrati dall'app. Entri con l'utente del progetto gestore."
          fi
          NOTES="$NOTES

          - Windows: scarica $NOME-Windows.exe e aprilo per installarlo.
          - Mac: scarica $NOME-Mac.dmg, aprilo e trascina Club Gestore in Applicazioni. La prima volta aprilo con clic destro → Apri.
          - Android: scarica $NOME-Android.apk dal telefono e aprilo per installarlo."
          gh release view $TAG >/dev/null 2>&1 || gh release create $TAG --prerelease --title "$TITLE" --notes "$NOTES"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - run: npm run web
        working-directory: desktop
      - run: npm run dist -- -c.appId=$APP_ID -c.productName="Club Gestore" -c.extraMetadata.productName="Club Gestore" -c.nsis.shortcutName="Club Gestore" -c.win.artifactName=$NOME-Windows.exe -c.win.icon=../assets/images/icon-gestore.png
        shell: bash
        working-directory: desktop
      - name: Carica nelle Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload ${{ needs.release.outputs.tag }} desktop/release/$NOME-Windows.exe --clobber

  mac:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - run: npm run web
        working-directory: desktop
      - run: npm run dist:mac -- -c.appId=$APP_ID -c.productName="Club Gestore" -c.extraMetadata.productName="Club Gestore" -c.mac.artifactName=$NOME-Mac.dmg -c.mac.icon=../assets/images/icon-gestore.png
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Carica nelle Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload ${{ needs.release.outputs.tag }} desktop/release/$NOME-Mac.dmg --clobber

  # Lo stesso pannello come app per il telefono, costruita come l'app Android dei centri (mobile-demo).
  android:
    needs: release
    runs-on: ubuntu-latest
    env:
      APP_VERA: '1'
      # La stessa icona di Club Manager, con lo sfondo blu: sul telefono si distinguono.
      ICONA: ../assets/images/icon-gestore.png
      APK: ${{ inputs.demo && 'ClubGestore-Demo-Android.apk' || 'ClubGestore-Android.apk' }}
      AAB: ClubGestore-Android.aab
      # Google sul telefono usa il client web (vedi gestore/README.md): vuota = solo email e password.
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ !inputs.demo && vars.GOOGLE_WEB_CLIENT_ID || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm install
        working-directory: mobile-demo
      - run: npm run web
        working-directory: mobile-demo
      - name: Nome dell'app
        working-directory: mobile-demo
        run: |
          NAME="Club Gestore"; [ -n "$EXPO_PUBLIC_PANNELLO_DEMO" ] && NAME="Club Gestore Demo"
          sed -i "s/\"it.campocani.demo\"/\"$APP_ID\"/; s/\"Club Manager Demo\"/\"$NAME\"/" capacitor.config.json
          sed -i "s#<title>Club Manager</title>#<title>$NAME</title>#" www/index.html
          cat capacitor.config.json
      - run: npx cap add android
        working-directory: mobile-demo
      # Firmato con la chiave della demo, come le altre app da installare a mano: le versioni nuove vanno sopra le vecchie.
      - run: ./android-build.sh
        working-directory: mobile-demo
      - name: Carica nelle Releases
        working-directory: mobile-demo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload ${{ needs.release.outputs.tag }} "$APK" --clobber
