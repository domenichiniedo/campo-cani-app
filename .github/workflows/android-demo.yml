# Costruisce la demo da installare sui telefoni Android (ClubManager-Demo.apk) e da caricare su Google Play
# (ClubManager-Demo.aab, vedi README "Google Play"): l'app vera con i dati
# di esempio, senza database, con il bottone "Demo" per entrare come proprietario, cliente o trainer.
# Si scarica dal telefono da GitHub → Releases → "Demo per Android" (file ClubManager-Demo.apk),
# oppure da Actions → "Demo per Android" → l'ultima esecuzione → Artifacts.
# Partenza: a mano (Run workflow), che la pubblica nelle Releases, o quando una PR cambia la demo:
# in quel caso si costruisce solo per provarla e l'APK resta negli Artifacts.
# Con "prova" spuntato esce invece la prova del piano Pro (ClubManager-Prova.apk, Releases → "Prova Pro per
# Android"): niente cambio di piano e dopo 3 giorni dalla prima apertura l'app si blocca. È un'app a parte,
# quindi sul telefono può stare insieme alla demo.
name: Demo per Android

on:
  workflow_dispatch:
    inputs:
      prova:
        description: Prova del piano Pro che dura 3 giorni
        type: boolean
        default: false
  # La usa anche "Aggiorna le app", quando la lanci.
  workflow_call:
    inputs:
      prova:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      DEMO_PROVA_GIORNI: ${{ inputs.prova && '3' || '' }}
      APK: ${{ inputs.prova && 'ClubManager-Prova.apk' || 'ClubManager-Demo.apk' }}
      AAB: ${{ inputs.prova && 'ClubManager-Prova.aab' || 'ClubManager-Demo.aab' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm install
        working-directory: mobile-demo
      - run: npm run web
        working-directory: mobile-demo
      - name: App a parte per la prova
        if: ${{ inputs.prova }}
        working-directory: mobile-demo
        run: |
          sed -i 's/"it.campocani.demo"/"it.campocani.prova"/; s/"Club Manager Demo"/"Club Manager Prova"/' capacitor.config.json
          cat capacitor.config.json
      - run: npx cap add android
        working-directory: mobile-demo
      # Chiave di caricamento di Google Play, dai secrets (vedi README, "Google Play"). Senza, l'AAB non si pubblica.
      - name: Chiave di caricamento di Google Play
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "Nessuna chiave di caricamento: l'AAB resta solo di prova."; exit 0; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "UPLOAD_KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}"
          } >> "$GITHUB_ENV"
      # Build di rilascio come la vuole Google Play (API 36, 16 KB, versione che cresce), con i controlli:
      # vedi mobile-demo/android-build.sh.
      - run: ./android-build.sh
        working-directory: mobile-demo
      # Lo spazio per gli artifact di GitHub ha un limite: se è pieno la build va avanti lo stesso e il file esce
      # nelle Releases (che non contano nel limite).
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 7
          name: ${{ inputs.prova && 'ClubManager-Prova-Android' || 'ClubManager-Demo-Android' }}
          path: |
            mobile-demo/${{ env.APK }}
            mobile-demo/${{ env.AAB }}
          if-no-files-found: error
      # Release fissa "demo-android": il link per scaricare l'APK dal telefono resta sempre lo stesso.
      # Solo le demo costruite a mano: una PR non ancora unita non deve sostituire la demo pubblicata
      # (e due PR insieme si pestavano i piedi caricando lo stesso file).
      - name: Pubblica nelle Releases
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: mobile-demo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # L'AAB per Google Play solo se è firmato con la chiave di caricamento.
          FILES="$APK"; [ -n "${UPLOAD_KEYSTORE:-}" ] && FILES="$APK $AAB"
          if [ -n "$DEMO_PROVA_GIORNI" ]; then
            NOTES="Prova di Club Manager nel piano Pro, con i dati di esempio e senza pagamenti online. Scarica ClubManager-Prova.apk dal telefono e aprilo per installarlo. Dura $DEMO_PROVA_GIORNI giorni dalla prima apertura, poi l'app si blocca."
            gh release view demo-prova >/dev/null 2>&1 || gh release create demo-prova --prerelease --title "Prova Pro per Android" --notes "$NOTES"
            gh release edit demo-prova --title "Prova Pro per Android" --notes "$NOTES"
            gh release upload demo-prova $FILES --clobber
            exit 0
          fi
          NOTES="Demo di Club Manager con i dati di esempio. Scarica ClubManager-Demo.apk dal telefono e aprilo per installarlo. Se il telefono non la installa sopra una demo vecchia, disinstalla prima quella vecchia (solo la prima volta)."
          gh release view demo-android >/dev/null 2>&1 || gh release create demo-android --prerelease --title "Demo per Android" --notes "$NOTES"
          gh release edit demo-android --title "Demo per Android" --notes "$NOTES"
          gh release upload demo-android $FILES --clobber
          # Il file col vecchio nome (prima di Club Manager) non si aggiorna più: si toglie per non confondersi.
          gh release delete-asset demo-android CampoCani-Demo.apk -y || true
