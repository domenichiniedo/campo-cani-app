# Costruisce la demo da installare sui telefoni Android (CampoCani-Demo.apk): l'app vera con i dati
# di esempio, senza database, con il bottone "Demo" per entrare come proprietario, cliente o trainer.
# La trovi in GitHub → Actions → "Demo per Android" → l'ultima esecuzione → Artifacts.
# Partenza: a mano (Run workflow) o quando una PR cambia la demo.
name: Demo per Android

on:
  workflow_dispatch:
  pull_request:
    paths: ['mobile-demo/**', 'desktop/demo/**', '.github/workflows/android-demo.yml']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm install
        working-directory: mobile-demo
      - run: npm run web
        working-directory: mobile-demo
      - run: npx cap add android
        working-directory: mobile-demo
      # Icona dell'app: quella di Campo Cani al posto di quella di Capacitor.
      - name: Icona
        working-directory: mobile-demo/android/app/src/main/res
        run: |
          rm -rf mipmap-anydpi-v26
          for d in mipmap-*; do
            cp ../../../../../../assets/images/icon.png "$d/ic_launcher.png"
            cp ../../../../../../assets/images/icon.png "$d/ic_launcher_round.png"
            rm -f "$d/ic_launcher_foreground.png"
          done
      - run: npx cap sync android
        working-directory: mobile-demo
      - run: ./gradlew assembleDebug
        working-directory: mobile-demo/android
      - run: cp mobile-demo/android/app/build/outputs/apk/debug/app-debug.apk CampoCani-Demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CampoCani-Demo-Android
          path: CampoCani-Demo.apk
          if-no-files-found: error
